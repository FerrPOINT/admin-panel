  <text x="121" y="148" fill="#B3E1FF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="1.1">BRANDING · SERVICE REGISTRY · ROLE BINDINGS · AUDIT</text>
