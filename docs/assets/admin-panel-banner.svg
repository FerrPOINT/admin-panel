<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Base Command Center</title>
  <desc id="desc">Admin Panel for Base branding, service registry, role bindings and audit.</desc>
  <defs>
    <linearGradient id="backdrop" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07152F"/>
      <stop offset="0.52" stop-color="#102E71"/>
      <stop offset="1" stop-color="#1664C0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#71C7FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C2E6FF"/>
      <stop offset="1" stop-color="#71C7FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="420" fill="url(#backdrop)"/>
  <g fill="none" stroke="#81CFFF" stroke-opacity="0.16">
