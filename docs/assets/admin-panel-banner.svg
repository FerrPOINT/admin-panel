    <path d="M110 298L328 210L532 260L750 136L950 199L1180 94L1435 158" stroke="url(#line)" filter="url(#glow)"/>
  </g>
  <g fill="#0C2B65" stroke="#C2E6FF" stroke-width="3">
    <circle cx="110" cy="298" r="13"/>
    <circle cx="328" cy="210" r="13"/>
    <circle cx="532" cy="260" r="13"/>
    <circle cx="750" cy="136" r="13"/>
    <circle cx="950" cy="199" r="13"/>
    <circle cx="1180" cy="94" r="13"/>
    <circle cx="1435" cy="158" r="13"/>
  </g>
