name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: README validator tests
        run: python3 -m unittest scripts.tests.test_verify_readme
      - name: README structural validation
        run: python3 scripts/verify_readme.py

  backend:
    # Dependabot runs do not receive repository secrets, so the
    # services-base checkout token is unavailable — skip full builds there.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: admin-panel/backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: admin-panel
      - name: Check out services-base sibling (sdlc-auth-core path dep)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: admin-panel/backend
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: OpenAPI spec is up to date
        run: |
          cargo run -p admin-panel-api --bin gen-openapi > /tmp/openapi.generated.json
          python3 - <<'PYEOF'
          import json
          gen = json.load(open('/tmp/openapi.generated.json'))
          gen['info'].pop('license', None)
          committed = json.load(open('../openapi/openapi.json'))
          assert gen == committed, 'openapi/openapi.json is stale — regenerate with gen-openapi'
          PYEOF

  frontend:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-panel/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: admin-panel
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: 10.23.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin-panel/frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          CI: 'true'
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker-compose.dev.yml config -q
