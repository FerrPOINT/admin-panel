name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel/backend
    steps:
      - uses: actions/checkout@v7
        with:
          path: admin-panel
      - name: Check out services-base sibling (sdlc-auth-core path dep)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: admin-panel/backend
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: OpenAPI spec is up to date
        run: |
          cargo run -p admin-panel-api --bin gen-openapi > /tmp/openapi.generated.json
          python3 - <<'PYEOF'
          import json
          gen = json.load(open('/tmp/openapi.generated.json'))
          gen['info'].pop('license', None)
          committed = json.load(open('../openapi/openapi.json'))
          assert gen == committed, 'openapi/openapi.json is stale — regenerate with gen-openapi'
          PYEOF

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-panel/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: admin-panel
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin-panel/frontend/pnpm-lock.yaml
      - name: Install
        run: pnpm install --no-frozen-lockfile
        env:
          CI: 'true'
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker-compose.dev.yml config -q

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-panel/frontend
    steps:
      - uses: actions/checkout@v7
        with:
          path: admin-panel
      - name: Check out services-base sibling (@sdlc/ui file dep)
        uses: actions/checkout@v7
        with:
          repository: FerrPOINT/services-base
          path: services-base
          ref: main
          token: ${{ secrets.SERVICES_BASE_TOKEN }}
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin-panel/frontend/pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
        env:
          CI: "true"
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright against vite preview
        run: |
          pnpm exec vite preview --port 4177 --strictPort &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:4177/ >/dev/null 2>&1 && break
            sleep 1
          done
          PLAYWRIGHT_BASE_URL=http://localhost:4177 pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: admin-panel-playwright-traces
          path: admin-panel/frontend/test-results
          retention-days: 5
