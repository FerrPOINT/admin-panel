[workspace]
members = ["api", "app", "domain", "infra", "shared", "server", "migration"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["FerrPOINT <https://github.com/FerrPOINT>"]
license-file = "LICENSE"
repository = "https://github.com/FerrPOINT/admin-panel"

[workspace.dependencies]
# runtime
axum = { version = "0.8.3", features = ["macros"] }
tokio = { version = "1.44", features = ["full"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.15"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# db
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "derive"] }
# auth
jsonwebtoken = "9.3"
# time pinned: newer requires rustc 1.88; fleet toolchain is 1.86
time = "=0.3.41"
sha2 = "0.10"
hex = "0.4"
# validation
validator = { version = "0.19", features = ["derive"] }
# errors
thiserror = "2.0"
anyhow = "1.0"
# testing
reqwest = { version = "0.12", features = ["json"] }
# shared
uuid = { version = "1.16", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# web
http = "1.3"
# openapi
utoipa = { version = "5.0", features = ["axum_extras", "chrono"] }

[profile.release]
lto = "thin"
codegen-units = 1
